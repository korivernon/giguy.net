name = "giguy-feedback"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "giguy-feedback"
database_id = "REPLACE_AFTER_CREATE"

[vars]
# Pages allowed to call the API (the survey and the staff dashboard).
ALLOWED_ORIGINS = "https://giguy.net,https://www.giguy.net,https://korivernon.github.io,http://localhost:8479"

# Secrets (set with `npx wrangler secret put NAME`, never in this file):
#   STAFF_PASSCODE  - the code staff use to sign in to the dashboard
#   SESSION_SECRET  - random string used to sign staff sessions
